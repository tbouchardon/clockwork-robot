# yaml-language-server: $schema=../rotation.schema.json
# Démoniste Affliction : portage de la rotation Lua historique (rotation_warlock.lua de l'addon).
# ATTENTION : traduction littérale de l'ancienne rotation Lua, gameplay non revu pour la 12.x (priorités et sorts
# peuvent ne plus être pertinents). Elle est choisie automatiquement pour cette classe et cette spécialisation.
#
# Les debuffs sont illisibles en combat depuis la 12.x : « absent ou presque fini » devient « lancé sur cette cible il y
# a plus de X s », d'après les durées des tables du jeu (12.1, SpellMisc) : Affliction instable 8 s, Agonie 18 s,
# Corruption 14 s. À ajuster si un talent les allonge.
#
# Plusieurs ennemis, en mode multi-cibles (menu de l'addon) : une fois Agonie et Corruption posées sur la cible, s'il
# reste des ennemis en combat sans Agonie, passer au suivant (Tab), jusqu'à 3 ennemis affligés. ClockWork reconnaît
# chaque ennemi : revenu sur une cible déjà affligée, il ne relance rien. Hors mode multi-cibles, on reste sur sa cible.
# Sans mode aggro, en combat, une cible qui n'y est pas (Tab tombé sur un monstre non engagé, cible morte) est quittée
# aussitôt, pour ne combattre que ce qui attaque. Pas de DoT sur un ennemi sous 20 % : il mourra avant.

name: Démoniste Affliction
class: WARLOCK
spec: Affliction

# La rotation Lua ne suivait pas la recommandation de Blizzard
assisted:
  follow: false

rules:
  # Sans aggro, en combat, cible qui n'y est pas (Tab tombé sur un monstre non engagé, cible morte) : la quitter avant
  # tout, pour ne combattre que ce qui attaque. Avec aggro, elle est attaquée : c'est le but du mode
  - action: next-target
    when: "player.combat && !player.aggro && !target.combat"
    priority: 150

  # Lua : absente de la cible
  - cast: Affliction instable
    when: "target.hostile && spell.sinceCastOnTarget('Affliction instable') > 8"
    priority: 100

  # Lua : absente ou à moins de 4 s de la fin
  - cast: Agonie
    when: "target.hostile && target.health > 20 && spell.sinceCastOnTarget('Agonie') > 14"
    priority: 90

  # Lua : absente ou à moins de 2 s de la fin
  - cast: Corruption
    when: "target.hostile && target.health > 20 && spell.sinceCastOnTarget('Corruption') > 12"
    priority: 85

  # Multi-cibles : DoT posés ici, d'autres ennemis en combat sans Agonie (3 affligés au plus) : cible suivante
  - action: next-target
    when: >-
      multi
      && player.combat
      && spell.sinceCastOnTarget('Agonie') < 14
      && spell.sinceCastOnTarget('Corruption') < 12
      && spell.dotted('Agonie', 14) < enemies
      && spell.dotted('Agonie', 14) < 3
    priority: 50

  # Remplissage
  - cast: Trait de l'ombre
    when: "target.hostile"
    priority: 1
