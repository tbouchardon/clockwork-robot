# yaml-language-server: $schema=../rotation.schema.json
# Rotation du cerveau Java de ClockWork : chaman Élémentaire (exemple de départ).
# ClockWork choisit dans ce dossier la rotation de la classe et de la spécialisation du personnage (« class » et « spec »),
# sinon celle de toute sa classe (sans « spec ») ; sans rotation pour lui, c'est l'addon qui décide seul.
# Les fichiers sont rechargés à chaud à chaque enregistrement. Un rotation.yaml dans le dossier de lancement impose sa
# rotation quel que soit le personnage.
#
# Une règle s'applique si son sort est sur une touche (seule ou avec Maj, Ctrl, Alt), prêt (utilisable, sans temps de recharge,
# pas hors de portée) et si sa condition « when » est vraie. La plus haute priorité l'emporte.
# Les sorts se désignent par leur nom (n'importe quel sort du jeu, d'après les tables de wago.tools) ou par leur
# identifiant. Avec « class », l'éditeur (IntelliJ, VS Code + extension YAML) propose
# les sorts de la classe grâce au schéma de la première ligne ; ClockWork génère ce schéma (rotation.schema.json) à son démarrage.
#
# Dans les conditions (syntaxe JEXL : &&, ||, !, <, >, ==) :
#   player.health  player.power   player.combat   player.casting      (% et booléens)
#   player.form                   nom de la forme active (druide...), '' sans forme ; spell.form('Nom') : sous cette forme
#   player.combo                  points de combo
#   target.exists  target.hostile target.health   target.power   (hostile : ennemi vivant, faux sur un cadavre)
#   enemies                       ennemis en combat à proximité
#   assisted                      nom du sort recommandé par Blizzard
#   spell.ready('Nom')  spell.cooldown('Nom')  spell.usable('Nom')  spell.inRange('Nom')  spell.proc('Nom')
#   spell.sinceCast('Nom')  spell.sinceCastOnTarget('Nom')
#       secondes depuis le dernier lancement (toutes cibles / sur la cible actuelle), plafonnées à 60 s :
#       au-delà, ou jamais lancé, la valeur est infinie

name: Chaman Élémentaire (exemple)
class: SHAMAN
spec: Élémentaire

# Recommandation de Blizzard en repli : elle passe devant les règles de priorité inférieure
assisted:
  follow: true
  priority: 50

rules:
  - cast: Afflux de soins
    when: "player.health < 40"
    priority: 200

  # Horion de flamme (variante de talent 470411, celle qui est sur la barre) dure 18 s :
  # on le réapplique sur la cible après 13 s (fenêtre de 30 %)
  - cast: Horion de flamme
    when: "target.hostile && spell.sinceCastOnTarget('Horion de flamme') > 13"
    priority: 120

  - cast: Horion de terre
    when: "target.hostile && player.power > 60"
    priority: 100

  - cast: Éclair
    when: "target.hostile"
    priority: 10
