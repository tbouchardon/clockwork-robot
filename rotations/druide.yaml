# yaml-language-server: $schema=../rotation.schema.json
# Druide, toutes spécialisations : portage de la rotation Lua historique (rotation_druid.lua de l'addon).
# ATTENTION : traduction littérale de l'ancienne rotation Lua, gameplay non revu pour la 12.x (priorités et sorts
# peuvent ne plus être pertinents). Elle est choisie automatiquement pour toutes les spécialisations du druide.
#
# La rotation dépend de la forme du personnage :
#   - forme humaine ou de sélénien : Éclat lunaire entretenu sur la cible, Colère sinon ;
#   - forme d'ours : Mutilation ;
#   - forme de félin : Morsure féroce à partir de 3 points de combo, Lambeau sinon.
#
# Différence avec la version Lua : les debuffs sont illisibles en combat depuis la 12.x. « Éclat lunaire absent ou à
# moins de 2 s de la fin » devient « lancé sur cette cible il y a plus de 16 s » (le debuff dure 18 s d'après les tables
# du jeu, 12.1 ; à ajuster si un talent l'allonge).
#
# Comme pour toutes les rotations, rien n'est lancé pendant une incantation, sur une monture, mort, ni contre une cible
# marquée par un autre joueur : inutile de le répéter dans les conditions.
#
# Dans les conditions, les noms sont entre apostrophes droites : « Forme d’ours » s'écrit donc avec l'apostrophe
# typographique (’), que ClockWork confond avec l'apostrophe droite.

# Sans « spec » : la rotation vaut pour toutes les spécialisations du druide
name: Druide (toutes formes)
class: DRUID

# La rotation Lua ne suivait pas la recommandation de Blizzard
assisted:
  follow: false

rules:
  # --- Forme humaine ou de sélénien ---
  - cast: Éclat lunaire
    when: >-
      target.hostile
      && (player.form == '' || spell.form('Forme de sélénien'))
      && spell.sinceCastOnTarget('Éclat lunaire') > 16
    priority: 100

  - cast: Colère
    when: >-
      target.hostile
      && (player.form == '' || spell.form('Forme de sélénien'))
    priority: 80

  # --- Forme d'ours ---
  - cast: Mutilation
    when: "target.hostile && spell.form('Forme d’ours')"
    priority: 80

  # --- Forme de félin ---
  - cast: Morsure féroce
    when: "target.hostile && spell.form('Forme de félin') && player.combo > 2"
    priority: 100

  - cast: Lambeau
    when: "target.hostile && spell.form('Forme de félin')"
    priority: 80
